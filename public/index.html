<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Kids Tube">
<meta name="theme-color" content="#1b1446">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Kids Tube</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png">
<style>
  :root{--bg:#1b1446;--bg2:#2a1f6b;--card:#ffffff14;--text:#fff;--muted:#c9c3ff;--accent:#ffcc33;--ok:#3ddc97;--danger:#ff5c5c}
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html{background:var(--bg2)}
  html,body{margin:0;color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;background:linear-gradient(160deg,var(--bg),var(--bg2));padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);-webkit-user-select:none;user-select:none}
  button{font:inherit;color:inherit;cursor:pointer}
  input{font:inherit;-webkit-user-select:text;user-select:text}
  a{color:var(--accent)}
  .hidden{display:none!important}
  header{position:sticky;top:0;z-index:5;background:#1b1446ee;backdrop-filter:blur(8px);padding:12px 16px 8px}
  .top{display:flex;align-items:center;gap:12px}
  .logo{font-size:24px;font-weight:800}
  .logo span{color:var(--accent)}
  .spacer{flex:1}
  .timer{background:#ffffff1f;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
  .gear{background:none;border:0;font-size:22px;opacity:.45;padding:6px}
  .chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 4px;scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{display:flex;align-items:center;gap:8px;flex:none;border:2px solid transparent;background:var(--card);border-radius:999px;padding:6px 14px 6px 6px;font-weight:600;font-size:15px}
  .chip.all{padding:8px 16px}
  .chip{max-width:260px}
  .chip .cl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .search{flex:1;min-width:0;max-width:380px;padding:9px 14px;border-radius:999px;border:1px solid #ffffff33;background:#0003;color:#fff;font-size:15px}
  .search::placeholder{color:var(--muted)}
  @media (max-width:480px){.logo{font-size:20px}.timer{padding:6px 9px;font-size:13px}.top{gap:8px}}
  .chip img{width:30px;height:30px;border-radius:50%}
  .chip.on{border-color:var(--accent);background:#ffcc3326}
  main{padding:12px 16px 40px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:18px}
  .card{display:block;text-align:left;background:none;border:0;padding:0}
  .th{position:relative;aspect-ratio:16/9;border-radius:16px;overflow:hidden;background:#0003}
  .th img{width:100%;height:100%;object-fit:cover;display:block}
  .dur{position:absolute;right:8px;bottom:8px;background:#000c;border-radius:6px;padding:2px 6px;font-size:13px;font-weight:700}
  .t{margin-top:8px;font-weight:700;font-size:16px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .c{margin-top:4px;color:var(--muted);font-size:13px}
  .msg{text-align:center;color:var(--muted);padding:60px 20px;font-size:18px}
  .msg.err{color:#ffb3b3}
  #pw{position:fixed;inset:0;z-index:20;background:#000;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
  .pbar{display:flex;align-items:center;gap:12px;padding:10px 14px;background:#111}
  .back{background:var(--accent);color:#222;border:0;border-radius:999px;padding:10px 18px;font-weight:800;font-size:16px;flex:none}
  #ptitle{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .frame{position:relative;width:100%;max-height:68vh;aspect-ratio:16/9;margin:0 auto;background:#000}
  .frame iframe,#player{position:absolute;inset:0;width:100%;height:100%;border:0}
  .upnext{flex:1;overflow-y:auto;padding:14px;background:linear-gradient(160deg,var(--bg),var(--bg2))}
  .upnext h4{margin:0 0 10px;font-size:17px}
  .upnext .grid{grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
  .upnext .t{font-size:14px}
  #toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--accent);color:#222;font-weight:800;padding:12px 20px;border-radius:999px;z-index:30;box-shadow:0 6px 20px #0006}
  #pin{position:fixed;inset:0;z-index:40;background:#000b;display:flex;align-items:center;justify-content:center}
  .pinbox{background:var(--bg2);border-radius:24px;padding:22px;width:300px;text-align:center}
  .pinbox h3{margin:0 0 12px}
  .dots{font-size:28px;letter-spacing:10px;margin-bottom:14px}
  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .pad button{background:#ffffff1f;border:0;border-radius:16px;font-size:24px;font-weight:700;padding:14px 0}
  .pinerr{color:#ffb3b3;min-height:20px;margin:10px 0 0}
  .link{background:none;border:0;color:var(--muted);text-decoration:underline;font-size:14px;margin-top:6px}
  .panel{max-width:760px;margin:0 auto;padding:16px}
  .sec{background:var(--card);border-radius:18px;padding:16px;margin-bottom:16px}
  .sec h3{margin:0 0 10px}
  .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  label{display:block;font-weight:600;margin:10px 0 6px}
  .in{width:100%;padding:12px;border-radius:12px;border:1px solid #ffffff33;background:#0003;color:#fff}
  .row .in{flex:1;min-width:180px}
  .btn{border:0;border-radius:12px;padding:12px 16px;font-weight:700;background:var(--accent);color:#222}
  .btn.ghost{background:#ffffff1f;color:#fff}
  .btn.danger{background:var(--danger);color:#fff}
  .small{font-size:13px;color:var(--muted);line-height:1.5}
  .chan{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid #ffffff14}
  .chan:last-child{border-bottom:0}
  .chan img{width:36px;height:36px;border-radius:50%}
  .chan img.sq{width:64px;height:36px;border-radius:8px;object-fit:cover}
  .chan .n small{display:block;font-weight:400;color:var(--muted);font-size:13px}
  .chip img.sq{border-radius:8px;width:44px;object-fit:cover}
  .chan .n{flex:1;font-weight:600}
  .x{background:#ffffff1f;border:0;border-radius:10px;padding:8px 12px}
  .note{min-height:20px;margin-top:8px;font-size:14px}
  .note.err{color:#ffb3b3}.note.ok{color:var(--ok)}
  .check{display:flex;gap:10px;align-items:center;font-weight:600;margin:10px 0}
  .check input{width:22px;height:22px}
  .big{font-size:64px;text-align:center;margin-top:12vh}
  .who{display:flex;align-items:center;gap:10px}
  .who img{width:40px;height:40px;border-radius:50%}
  .hero{max-width:520px;margin:10vh auto 0;padding:24px;text-align:center}
  .hero h1{font-size:40px;margin:0 0 8px}
  .hero p{color:var(--muted);font-size:17px;line-height:1.5}
  #gbtn{display:flex;justify-content:center;margin:28px 0 12px;min-height:44px}
</style>
</head>
<body>
<div id="app"><div class="msg">Loading…</div></div>

<div id="pw" class="hidden">
  <div class="pbar"><button class="back" id="closeP">← Back</button><div id="ptitle"></div></div>
  <div class="frame"><div id="player"></div></div>
  <div class="upnext"><h4 id="upTitle">More videos</h4><div class="grid" id="upGrid"></div></div>
</div>
<div id="toast" class="hidden"></div>
<div id="pin" class="hidden"></div>

<script>
/* Kids Tube — client. Talks only to this site's /api; the YouTube API key stays on the server. */
const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toLocaleDateString('en-CA');
const LS_FORGOT = 'kyt.forgotPin';
const LS_NEXT = 'kyt.next';            // remembers "/tv" across the Google sign-in redirect
const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
const lsSet = (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch {} };

let me = null, videos = [], byId = {}, filterCh = 'all', query = '';
let parentToken = null, unlockExp = 0;

/* ---------------- API ---------------- */
async function api(path, { method = 'GET', body, unlock } = {}) {
  const headers = { 'X-Local-Day': today() };
  if (body !== undefined) headers['Content-Type'] = 'application/json';
  if (unlock && parentToken) headers['X-Parent-Token'] = parentToken;
  const r = await fetch('/api' + path, { method, headers, body: body !== undefined ? JSON.stringify(body) : undefined, credentials: 'same-origin' });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) {
    const e = new Error(j.error || 'Error ' + r.status); e.status = r.status;
    if (r.status === 401 && me) { renderLogin(); }   // session ended while using the app
    throw e;
  }
  return j;
}
// Parent-only call: asks for the PIN when the 15-minute unlock has expired, then retries once.
async function papi(path, opts = {}) {
  if (!(await ensureUnlocked())) throw Object.assign(new Error('Cancelled'), { cancelled: true });
  try { return await api(path, { ...opts, unlock: true }); }
  catch (e) {
    if (e.status !== 403 || !/PIN required/.test(e.message)) throw e;
    parentToken = null;
    if (!(await ensureUnlocked())) throw Object.assign(new Error('Cancelled'), { cancelled: true });
    return api(path, { ...opts, unlock: true });
  }
}
function setUnlock(t) { parentToken = t; unlockExp = Date.now() + 14 * 60 * 1000; }
async function ensureUnlocked() {
  if (parentToken && Date.now() < unlockExp) return true;
  return askPin();
}

/* ---------------- Formatting ---------------- */
function fmt(s) {
  const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = String(s % 60).padStart(2, '0');
  return h ? `${h}:${String(m).padStart(2, '0')}:${x}` : `${m}:${x}`;
}
function ago(iso) {
  const d = (Date.now() - new Date(iso)) / 86400000;
  if (d < 1) return 'today';
  if (d < 2) return 'yesterday';
  if (d < 30) return Math.floor(d) + ' days ago';
  if (d < 365) return Math.floor(d / 30) + ' mo ago';
  return Math.floor(d / 365) + ' yr ago';
}
function toast(msg) {
  const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden');
  clearTimeout(toast.h); toast.h = setTimeout(() => t.classList.add('hidden'), 3500);
}

/* ---------------- Screen time ---------------- */
let playing = false, pending = 0, curVid = null;
const timeUp = () => me && me.usage && me.usage.remaining === 0;
function timerText() {
  const r = me?.usage?.remaining;
  return r == null ? '' : '⏱ ' + Math.ceil(r / 60) + ' min left';
}
function updateTimer() {
  const t = $('#timer'); if (!t) return;
  t.textContent = timerText(); t.classList.toggle('hidden', !timerText());
}
async function flush(keepalive) {
  if (!pending) return;
  const s = pending; pending = 0;
  const v = curVid && { id: curVid.id, title: curVid.title, channel: curVid.channel, thumb: curVid.thumb };
  try {
    const r = await fetch('/api/usage/tick', {
      method: 'POST', keepalive: !!keepalive, credentials: 'same-origin',
      headers: { 'Content-Type': 'application/json', 'X-Local-Day': today() },
      body: JSON.stringify({ seconds: s, video: v })
    });
    if (r.ok) { me.usage = (await r.json()).usage; updateTimer(); } else pending += s;
  } catch { pending += s; }
}
setInterval(() => {
  if (!playing || !me) return;
  pending++;
  const u = me.usage;
  if (u && u.remaining != null) {
    u.remaining = Math.max(0, u.remaining - 1);
    updateTimer();
    if (u.remaining === 0) { flush(); closePlayer(); renderTimesUp(); return; }
  }
  if (pending >= 15) flush();
}, 1000);
document.addEventListener('visibilitychange', () => { if (document.hidden) flush(true); });

/* ---------------- PIN pad ---------------- */
function askPin(title = 'Parent PIN') {
  return new Promise(resolve => {
    const m = $('#pin'); let val = '', busy = false;
    m.innerHTML = `<div class="pinbox"><h3>${esc(title)}</h3><div class="dots"></div>
      <div class="pad">${[1,2,3,4,5,6,7,8,9,'✕',0,'⌫'].map(k => `<button data-k="${k}">${k}</button>`).join('')}</div>
      <p class="pinerr"></p><button class="link" data-k="forgot">Forgot PIN?</button></div>`;
    m.classList.remove('hidden');
    const err = m.querySelector('.pinerr');
    const dots = () => m.querySelector('.dots').textContent = '●'.repeat(val.length) + '○'.repeat(4 - val.length);
    const done = ok => { m.classList.add('hidden'); m.onclick = null; resolve(ok); };
    dots();
    m.onclick = async e => {
      const k = e.target.dataset && e.target.dataset.k;
      if (k === undefined || busy) return;
      if (k === '✕') return done(false);
      if (k === 'forgot') {
        err.innerHTML = 'Sign out, then sign in again with your Google account to set a new PIN.<br><button class="btn ghost" data-k="signout" style="margin-top:10px">Sign out</button>';
        return;
      }
      if (k === 'signout') { lsSet(LS_FORGOT, '1'); done(false); return signOut(); }
      if (k === '⌫') { val = val.slice(0, -1); return dots(); }
      if (val.length < 4) { val += k; dots(); }
      if (val.length === 4) {
        busy = true;
        try { const r = await api('/pin/verify', { method: 'POST', body: { pin: val } }); setUnlock(r.parentToken); done(true); }
        catch (x) { err.textContent = x.message; val = ''; dots(); }
        busy = false;
      }
    };
  });
}

/* ---------------- Player ---------------- */
let ytReady; const ytReadyP = new Promise(r => ytReady = r);
window.onYouTubeIframeAPIReady = () => ytReady();
(() => { const s = document.createElement('script'); s.src = 'https://www.youtube.com/iframe_api'; document.head.appendChild(s); })();

let player = null;
async function play(v) {
  if (!v) return;
  if (timeUp()) return renderTimesUp();
  flush();            // seconds watched so far belong to the previous video
  curVid = v;
  $('#pw').classList.remove('hidden');
  $('#ptitle').textContent = v.title;
  renderUpNext(v);
  $('.upnext').scrollTop = 0;
  await ytReadyP;
  if (player && player.loadVideoById) { player.loadVideoById(v.id); return; }
  player = new YT.Player('player', {
    host: 'https://www.youtube-nocookie.com',
    videoId: v.id,
    playerVars: { autoplay: 1, rel: 0, playsinline: 1, iv_load_policy: 3, origin: location.origin },
    events: {
      onStateChange: e => {
        playing = e.data === YT.PlayerState.PLAYING;
        if (e.data === YT.PlayerState.ENDED) { closePlayer(); toast('All done! 🎉 Pick another video'); }
      },
      onError: () => { playing = false; closePlayer(); toast("That video can't play here 😕"); }
    }
  });
}
function closePlayer() {
  playing = false;
  try { player && player.stopVideo(); } catch {}
  $('#pw').classList.add('hidden');
  flush();
}
$('#closeP').onclick = closePlayer;
function renderUpNext(cur) {
  const rest = videos.filter(v => v.id !== cur.id);
  const same = rest.filter(v => v.channelId === cur.channelId);
  $('#upTitle').textContent = same.length ? 'More from ' + cur.channel : 'More videos';
  $('#upGrid').innerHTML = (same.length ? same : rest).slice(0, 24).map(card).join('');
}
$('#upGrid').onclick = e => { const b = e.target.closest('[data-v]'); if (b) play(byId[b.dataset.v]); };

/* ---------------- Screens ---------------- */
const card = v => `<button class="card" data-v="${esc(v.id)}"><div class="th"><img loading="lazy" src="${esc(v.thumb)}" alt="">
  <span class="dur">${fmt(v.secs)}</span></div><div class="t">${esc(v.title)}</div>
  <div class="c">${esc(v.channel)} · ${ago(v.published)}</div></button>`;

const LOGIN_ERRORS = {
  csrf: 'Sign-in was interrupted — please try again.', token: 'Google sign-in could not be verified — please try again.',
  email: 'Please use a Google account with a verified email.', rate: 'Too many sign-in attempts — wait a few minutes.'
};
let gsiLoading = null;
function loadGsi() {
  return gsiLoading ||= new Promise((res, rej) => {
    const s = document.createElement('script'); s.src = 'https://accounts.google.com/gsi/client'; s.async = true;
    s.onload = res; s.onerror = () => rej(new Error('Could not load Google sign-in')); document.head.appendChild(s);
  });
}
async function renderLogin(errCode) {
  closePlayer();
  me = null; parentToken = null;
  if (location.pathname === '/tv') lsSet(LS_NEXT, 'tv');
  app.innerHTML = `<div class="hero"><h1>Kids<span style="color:var(--accent)">Tube</span></h1>
    <p>YouTube with only the channels <b>you</b> choose.<br>No search, no random recommendations, daily time limits.</p>
    <div id="gbtn"></div><div class="note err" style="text-align:center">${esc(LOGIN_ERRORS[errCode] || '')}</div>
    <p class="small">For parents. We only use your Google name and email to save your settings.
    <a href="/privacy">Privacy policy</a></p></div>`;
  try {
    const [{ googleClientId }] = await Promise.all([api('/config'), loadGsi()]);
    google.accounts.id.initialize({ client_id: googleClientId, ux_mode: 'redirect', login_uri: location.origin + '/api/auth/google' });
    google.accounts.id.renderButton($('#gbtn'), { theme: 'filled_blue', size: 'large', shape: 'pill', text: 'signin_with' });
  } catch (e) { $('#gbtn').innerHTML = `<div class="note err">${esc(e.message)}</div>`; }
}
async function signOut() {
  closePlayer();
  try { await api('/auth/logout', { method: 'POST' }); } catch {}
  renderLogin();
}

function renderSetPin(first) {
  app.innerHTML = `<div class="panel"><h1>${first ? 'Welcome, ' + esc(me.parent.name || 'parent') + ' 👋' : 'Set a new PIN'}</h1>
    <div class="sec"><h3>${first ? 'Create a 4-digit parent PIN' : 'New 4-digit PIN'}</h3>
      <p class="small">You'll need this PIN to change settings on your child's device. Keep it secret from the kids!</p>
      <div class="row"><input class="in" id="p1" type="password" inputmode="numeric" maxlength="4" placeholder="PIN">
      <input class="in" id="p2" type="password" inputmode="numeric" maxlength="4" placeholder="Repeat PIN"></div>
      <button class="btn" id="go" style="margin-top:14px">Save PIN</button><div class="note" id="note"></div></div></div>`;
  $('#go').onclick = async () => {
    const p1 = $('#p1').value, p2 = $('#p2').value, note = $('#note');
    note.className = 'note err';
    if (!/^\d{4}$/.test(p1)) return note.textContent = 'PIN must be 4 digits';
    if (p1 !== p2) return note.textContent = "PINs don't match";
    try {
      const r = await api('/pin', { method: 'POST', body: { pin: p1 } });
      setUnlock(r.parentToken); lsSet(LS_FORGOT, null); me.hasPin = true;
      renderParent();
    } catch (e) { note.textContent = e.message; }
  };
}

async function renderHome() {
  closePlayer();
  app.innerHTML = `<header><div class="top"><div class="logo">Kids<span>Tube</span></div>
      <input class="search" id="q" type="search" placeholder="🔍 Search my videos" autocomplete="off" autocorrect="off" enterkeyhint="search"><div class="spacer"></div>
      <div class="timer hidden" id="timer"></div><button class="gear" id="gear" aria-label="Parent settings">⚙️</button></div>
      <div class="chips" id="chips"></div></header>
    <main><div class="grid" id="grid"></div><div class="msg" id="msg">Loading videos…</div></main>`;
  $('#gear').onclick = async () => { if (await ensureUnlocked()) renderParent(); };
  $('#q').value = query;
  $('#q').oninput = e => { query = e.target.value; drawGrid(); };
  $('#q').onkeydown = e => { if (e.key === 'Enter') e.target.blur(); };   // hide the keyboard
  try {
    me = await api('/me');
    updateTimer();
    if (timeUp()) return renderTimesUp();
    if (!me.channels.length && !me.playlists.length && !me.picks.length) {
      $('#msg').textContent = 'No videos yet — a parent can add channels, playlists or videos with ⚙️'; return;
    }
    const r = await api('/videos');
    videos = r.videos; me.usage = r.usage; updateTimer();
    byId = Object.fromEntries(videos.map(v => [v.id, v]));
    drawHome();
    if (r.failedChannels) toast(`${r.failedChannels} channel(s) or playlist(s) couldn't load right now`);
  } catch (e) {
    if (e.status === 401) return;
    $('#msg').className = 'msg err'; $('#msg').textContent = 'Could not load videos: ' + e.message;
  }
}
function drawHome() {
  const chips = $('#chips'), grid = $('#grid'), msg = $('#msg');
  if (!chips) return;
  const chipList = [
    ...(me.picks.length ? [{ id: 'picks', title: '💖 My picks' }] : []),
    ...me.playlists.map(p => ({ id: p.id, title: p.title, thumb: p.thumb, sq: true })),
    ...me.channels
  ];
  if (filterCh !== 'all' && !chipList.some(c => c.id === filterCh)) filterCh = 'all';
  chips.innerHTML = `<button class="chip all ${filterCh === 'all' ? 'on' : ''}" data-ch="all">⭐ All</button>` +
    chipList.map(c => `<button class="chip ${c.thumb ? '' : 'all'} ${filterCh === c.id ? 'on' : ''}" data-ch="${esc(c.id)}" title="${esc(c.title)}">
      ${c.thumb ? `<img class="${c.sq ? 'sq' : ''}" src="${esc(c.thumb)}" alt="">` : ''}<span class="cl">${esc(c.title)}</span></button>`).join('');
  chips.onclick = e => { const b = e.target.closest('[data-ch]'); if (b) { filterCh = b.dataset.ch; drawHome(); } };
  drawGrid();
}
// Search only looks through the videos already loaded (approved ones) — it never searches YouTube.
function drawGrid() {
  const grid = $('#grid'), msg = $('#msg');
  if (!grid) return;
  const words = query.toLowerCase().split(/\s+/).filter(Boolean);
  const list = videos.filter(v => (filterCh === 'all' || (v.src || []).includes(filterCh))
    && words.every(w => (v.title + ' ' + v.channel).toLowerCase().includes(w)));
  grid.innerHTML = list.map(card).join('');
  grid.onclick = e => { const b = e.target.closest('[data-v]'); if (b) play(byId[b.dataset.v]); };
  msg.className = 'msg';
  msg.textContent = words.length ? `No videos match "${query.trim()}"` + (filterCh !== 'all' ? ' here — try ⭐ All' : '') : 'No videos here yet.';
  msg.classList.toggle('hidden', list.length > 0);
}
// Pick up changes a parent makes from their own phone.
setInterval(() => {
  if (!playing && me && $('#grid') && !document.hidden && document.activeElement?.id !== 'q') renderHome();
}, 10 * 60 * 1000);

function renderLinkTv() {
  closePlayer();
  app.innerHTML = `<div class="panel">
    <div class="row" style="margin-bottom:12px"><h1 style="margin:0;flex:1">📺 Link a TV</h1><button class="btn ghost" id="back">Done</button></div>
    <div class="sec"><p class="small" style="font-size:16px">Open the <b>Kids Tube</b> app on the TV. It shows a code like <b>K7P-4QX</b>. Type it here:</p>
      <div class="row"><input class="in" id="code" placeholder="K7P-4QX" maxlength="8" autocapitalize="characters" autocorrect="off"
        autocomplete="off" style="font-size:26px;letter-spacing:4px;text-transform:uppercase">
      <button class="btn" id="go">Link TV</button></div>
      <div class="note" id="note"></div>
      <p class="small">The TV will use your channels, playlists, filters and time limit. To unlink TVs later:
      ⚙️ Parent settings → Sign out other devices.</p></div></div>`;
  $('#back').onclick = renderHome;
  $('#go').onclick = async () => {
    const n = $('#note'); n.className = 'note'; n.textContent = 'Linking…';
    try {
      await papi('/tv/approve', { method: 'POST', body: { code: $('#code').value } });
      n.className = 'note ok'; n.textContent = '✓ TV linked! It will open Kids Tube in a few seconds.'; $('#code').value = '';
    } catch (e) { n.className = 'note err'; n.textContent = e.cancelled ? '' : e.message; }
  };
  $('#code').onkeydown = e => { if (e.key === 'Enter') $('#go').click(); };
  $('#code').focus();
}

function renderTimesUp() {
  app.innerHTML = `<div class="panel" style="text-align:center"><div class="big">🌙</div>
    <h1>Time's up for today!</h1><p class="small" style="font-size:16px">Come back tomorrow for more videos.</p>
    <button class="btn ghost" id="more">Parent: add 15 minutes</button></div>`;
  $('#more').onclick = async () => {
    try { const r = await papi('/usage/bonus', { method: 'POST', body: { minutes: 15 } }); me.usage = r.usage; renderHome(); }
    catch (e) { if (!e.cancelled) toast(e.message); }
  };
}

function renderParent() {
  closePlayer();
  const s = me.settings;
  let chans = me.channels.slice(), pls = me.playlists.slice(), picks = me.picks.slice();
  const u = me.usage || { seconds: 0 };
  app.innerHTML = `<div class="panel">
    <div class="row" style="margin-bottom:12px"><h1 style="margin:0;flex:1">Parent settings</h1><button class="btn" id="done">Save ✓</button></div>
    <div class="sec"><h3>Approved channels</h3><div id="chanList"></div>
      <label>Add a channel</label>
      <div class="row"><input class="in" id="chIn" placeholder="@TechnoGamerzOfficial or channel link" autocapitalize="off" autocorrect="off">
      <button class="btn" id="chAdd">Add</button></div>
      <div class="note" id="chNote"></div>
      <p class="small">On YouTube, open the channel → tap its name → copy the @handle, or use Share → Copy link.</p></div>
    <div class="sec"><h3>Playlists</h3><div id="plList"></div>
      <label>Add a playlist</label>
      <div class="row"><input class="in" id="plIn" placeholder="https://www.youtube.com/playlist?list=…" autocapitalize="off" autocorrect="off">
      <button class="btn" id="plAdd">Add</button></div>
      <div class="note" id="plNote"></div>
      <p class="small">Shows up to 100 videos from the playlist. On YouTube: open the playlist → Share → Copy link.
      The playlist must be Public or Unlisted. New videos added to it show up within an hour.</p></div>
    <div class="sec"><h3>Single videos</h3><div id="vList"></div>
      <label>Add a video</label>
      <div class="row"><input class="in" id="vIn" placeholder="https://youtu.be/… or youtube.com/watch?v=…" autocapitalize="off" autocorrect="off">
      <button class="btn" id="vAdd">Add</button></div>
      <div class="note" id="vNote"></div>
      <p class="small">Shown under 💖 My picks. On YouTube: open the video → Share → Copy link.</p></div>
    <div class="sec"><h3>Filters</h3>
      <p class="small" style="margin:0">Apply to channels and playlists. Single videos you add yourself are always shown.</p>
      <label>Hide videos whose title, description or tags contain (comma separated)</label>
      <input class="in" id="words" placeholder="e.g. GTA, horror, prank" value="${esc(s.blockWords.join(', '))}">
      <label class="check"><input type="checkbox" id="shorts" ${s.hideShorts ? 'checked' : ''}> Hide Shorts &amp; clips under 3 min</label>
      <label>Latest videos per channel</label>
      <input class="in" id="per" type="number" min="5" max="50" value="${s.perChannel}"></div>
    <div class="sec"><h3>Screen time</h3>
      <label>Daily limit in minutes (0 = no limit)</label>
      <input class="in" id="lim" type="number" min="0" max="600" value="${s.dailyLimit}">
      <p class="small">Watched today: ${Math.floor(u.seconds / 60)} min</p>
      <div class="row"><button class="btn ghost" id="bonus">+15 min today</button><button class="btn ghost" id="resetT">Reset today</button></div></div>
    <div class="sec"><h3>Watch history (last 7 days)</h3><div id="hist"><p class="small">Loading…</p></div>
      <button class="btn ghost" id="histClear" style="margin-top:10px">Clear history</button>
      <p class="small">Older days are deleted automatically.</p></div>
    <div class="sec"><h3>Account</h3>
      <div class="who">${me.parent.picture ? `<img src="${esc(me.parent.picture)}" alt="">` : ''}<div><b>${esc(me.parent.name)}</b><div class="small">${esc(me.parent.email)}</div></div></div>
      <label>Change PIN</label>
      <div class="row"><input class="in" id="np" type="password" inputmode="numeric" maxlength="4" placeholder="New 4-digit PIN"><button class="btn ghost" id="npGo">Change</button></div>
      <div class="row" style="margin-top:14px"><button class="btn ghost" id="linkTv">📺 Link a TV</button>
        <button class="btn ghost" id="outOthers">Sign out other devices</button></div>
      <div class="row" style="margin-top:10px"><button class="btn ghost" id="out">Sign out</button><button class="btn danger" id="del">Delete account</button></div>
      <div class="note" id="accNote"></div></div>
    <div class="note" id="note"></div></div>`;

  const drawChans = () => {
    $('#chanList').innerHTML = chans.length ? chans.map(c => `<div class="chan">
      ${c.thumb ? `<img src="${esc(c.thumb)}" alt="">` : ''}<div class="n">${esc(c.title)}</div>
      <button class="x" data-rm="${esc(c.id)}">Remove</button></div>`).join('') : '<p class="small">None yet — add your first channel below.</p>';
  };
  drawChans();
  $('#chanList').onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { chans = chans.filter(c => c.id !== b.dataset.rm); drawChans(); } };
  $('#chAdd').onclick = async () => {
    const n = $('#chNote'); n.className = 'note'; n.textContent = 'Looking up…';
    try {
      const c = await papi('/channels', { method: 'POST', body: { input: $('#chIn').value } });
      if (chans.some(x => x.id === c.id)) { n.className = 'note err'; n.textContent = 'Already added'; return; }
      chans.push(c); drawChans(); $('#chIn').value = '';
      n.className = 'note ok'; n.textContent = 'Added ' + c.title + ' — tap Save when done';
    } catch (e) { n.className = 'note err'; n.textContent = e.cancelled ? '' : e.message; }
  };
  $('#chIn').onkeydown = e => { if (e.key === 'Enter') $('#chAdd').click(); };

  // Playlists and single videos: same add/remove pattern as channels.
  const listUi = ({ box, input, btn, note, path, get, set, empty, sq }) => {
    const draw = () => {
      const items = get();
      $(box).innerHTML = items.length ? items.map(x => `<div class="chan">
        ${x.thumb ? `<img class="${sq ? 'sq' : ''}" src="${esc(x.thumb)}" alt="">` : ''}
        <div class="n">${esc(x.title)}${x.channel ? `<small>${esc(x.channel)}</small>` : ''}</div>
        <button class="x" data-rm="${esc(x.id)}">Remove</button></div>`).join('') : `<p class="small">${empty}</p>`;
    };
    draw();
    $(box).onclick = e => { const b = e.target.closest('[data-rm]'); if (b) { set(get().filter(x => x.id !== b.dataset.rm)); draw(); } };
    $(btn).onclick = async () => {
      const n = $(note); n.className = 'note'; n.textContent = 'Looking up…';
      try {
        const x = await papi(path, { method: 'POST', body: { input: $(input).value } });
        if (get().some(y => y.id === x.id)) { n.className = 'note err'; n.textContent = 'Already added'; return; }
        set([...get(), x]); draw(); $(input).value = '';
        n.className = 'note ok'; n.textContent = 'Added ' + x.title + ' — tap Save when done';
      } catch (e) { n.className = 'note err'; n.textContent = e.cancelled ? '' : e.message; }
    };
    $(input).onkeydown = e => { if (e.key === 'Enter') $(btn).click(); };
  };
  listUi({ box: '#plList', input: '#plIn', btn: '#plAdd', note: '#plNote', path: '/picks/playlist', sq: true,
    get: () => pls, set: v => pls = v, empty: 'None yet.' });
  listUi({ box: '#vList', input: '#vIn', btn: '#vAdd', note: '#vNote', path: '/picks/video', sq: true,
    get: () => picks, set: v => picks = v, empty: 'None yet.' });
  const usageAct = async (path, body) => {
    try { const r = await papi(path, { method: 'POST', body }); me.usage = r.usage; toast('Updated'); }
    catch (e) { if (!e.cancelled) toast(e.message); }
  };
  const mins = s => s < 60 ? '< 1 min' : Math.round(s / 60) + ' min';
  const dayName = d => {
    const yest = new Date(Date.now() - 86400000).toLocaleDateString('en-CA');
    if (d === today()) return 'Today';
    if (d === yest) return 'Yesterday';
    return new Date(d + 'T12:00:00').toLocaleDateString(undefined, { weekday: 'long', day: 'numeric', month: 'short' });
  };
  const loadHistory = async () => {
    try {
      const { days } = await papi('/history');
      $('#hist').innerHTML = days.length ? days.map(d => `<label>${esc(dayName(d.day))} · ${mins(d.seconds)}</label>` +
        d.videos.map(v => `<div class="chan">${v.thumb ? `<img class="sq" src="${esc(v.thumb)}" alt="">` : ''}
          <div class="n">${esc(v.title)}<small>${esc(v.channel)}</small></div><span class="small">${mins(v.seconds)}</span></div>`).join('')
      ).join('') : '<p class="small">Nothing watched in the last 7 days.</p>';
    } catch (e) { $('#hist').innerHTML = `<p class="small">${e.cancelled ? '' : esc(e.message)}</p>`; }
  };
  loadHistory();
  $('#histClear').onclick = async () => {
    const b = $('#histClear');
    if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Tap again to clear'; return; }
    try { await papi('/history', { method: 'DELETE' }); b.dataset.sure = ''; b.textContent = 'Clear history'; loadHistory(); }
    catch (e) { if (!e.cancelled) toast(e.message); }
  };
  $('#bonus').onclick = () => usageAct('/usage/bonus', { minutes: 15 });
  $('#resetT').onclick = () => usageAct('/usage/reset', {});
  $('#npGo').onclick = async () => {
    const n = $('#accNote'), pin = $('#np').value;
    n.className = 'note err';
    if (!/^\d{4}$/.test(pin)) return n.textContent = 'PIN must be 4 digits';
    try { await ensureUnlocked(); const r = await api('/pin', { method: 'POST', body: { pin }, unlock: true }); setUnlock(r.parentToken); $('#np').value = ''; n.className = 'note ok'; n.textContent = 'PIN changed'; }
    catch (e) { n.textContent = e.message; }
  };
  $('#out').onclick = signOut;
  $('#linkTv').onclick = renderLinkTv;
  $('#outOthers').onclick = async () => {
    const n = $('#accNote'), b = $('#outOthers');
    if (!b.dataset.sure) { b.dataset.sure = '1'; b.textContent = 'Tap again to confirm'; n.className = 'note';
      n.textContent = 'TVs, tablets and other phones signed in to your account will need to sign in again.'; return; }
    try { const r = await papi('/auth/logout-others', { method: 'POST' }); n.className = 'note ok';
      n.textContent = `Signed out ${r.removed} other device(s).`; b.dataset.sure = ''; b.textContent = 'Sign out other devices'; }
    catch (e) { if (!e.cancelled) { n.className = 'note err'; n.textContent = e.message; } }
  };
  $('#del').onclick = async () => {
    const n = $('#accNote');
    if (!$('#del').dataset.sure) {
      $('#del').dataset.sure = '1'; $('#del').textContent = 'Tap again to delete everything';
      n.className = 'note err'; n.textContent = 'This deletes your settings and channel list permanently.'; return;
    }
    try { await papi('/account', { method: 'DELETE' }); renderLogin(); } catch (e) { if (!e.cancelled) { n.textContent = e.message; } }
  };
  $('#done').onclick = async () => {
    const note = $('#note');
    try {
      const r = await papi('/settings', { method: 'PUT', body: {
        channels: chans.map(c => c.id),
        playlists: pls.map(p => p.id),
        videos: picks.map(v => v.id),
        blockWords: $('#words').value.split(',').map(x => x.trim()).filter(Boolean),
        hideShorts: $('#shorts').checked,
        perChannel: parseInt($('#per').value) || 25,
        dailyLimit: parseInt($('#lim').value) || 0
      }});
      me.settings = r.settings; me.channels = r.channels; me.playlists = r.playlists; me.picks = r.picks;
      renderHome();
    } catch (e) { if (!e.cancelled) { note.className = 'note err'; note.textContent = e.message; } }
  };
}

/* ---------------- Start ---------------- */
(async function start() {
  const e = new URLSearchParams(location.search).get('e');
  if (location.search) history.replaceState(null, '', '/');
  try { me = await api('/me'); }
  catch (x) {
    if (x.status === 401) return renderLogin(e);
    app.innerHTML = `<div class="msg err">Can't reach Kids Tube right now. Check your internet and reload.</div>`; return;
  }
  if (!me.hasPin || (lsGet(LS_FORGOT) && me.canResetPin)) return renderSetPin(!me.hasPin);
  lsSet(LS_FORGOT, null);
  if (location.pathname === '/tv' || lsGet(LS_NEXT) === 'tv') {
    lsSet(LS_NEXT, null); history.replaceState(null, '', '/');
    return renderLinkTv();
  }
  renderHome();
})();
</script>
</body>
</html>

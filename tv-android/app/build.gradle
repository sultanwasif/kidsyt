plugins {
    id 'com.android.application'
}

// Release signing comes from tv-android/keystore.properties (never committed). Without it, the debug key is used.
def ksFile = rootProject.file('keystore.properties')
def ks = new Properties()
if (ksFile.exists()) ksFile.withInputStream { ks.load(it) }

android {
    namespace 'com.ehfservices.hasslefreetv'
    compileSdk 36

    defaultConfig {
        applicationId 'com.ehfservices.hasslefreetv'
        minSdk 25            // Fire OS 6+ / Android 7.1+ (older TV web engines can't run the app)
        targetSdk 36
        versionCode 2
        versionName '1.0.1'
        buildConfigField 'String', 'START_URL', '"https://tv.ehfservices.com/tv-app"'
    }

    buildFeatures {
        buildConfig true
    }

    signingConfigs {
        release {
            if (ksFile.exists()) {
                storeFile file(ks['storeFile'])
                storePassword ks['storePassword']
                keyAlias ks['keyAlias']
                keyPassword ks['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig ksFile.exists() ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
